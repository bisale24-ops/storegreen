[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "storegreen"
version = "0.1.0"
description = "Store rejection preflight for Android apps"
license = {text = "MIT"}
requires-python = ">=3.9"
readme = "README.md"

[project.scripts]
storegreen = "storegreen.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
